# docker-compose.yml — owner: D (P0.9)
#
# The whole production stack on one Vultr instance: Caddy (TLS) → web (Next.js) and
# worker (ingest + travel precompute), plus OTP once the graph exists.
#
#   docker compose up -d --build          # web + worker + caddy
#   docker compose --profile otp up -d    # add the router (needs otp/data/graph.obj)
#
# Values come from a manually-created `.env` next to this file (variables are listed in
# SPEC.md §20). `.env` is git-ignored; `DATABASE_URL` and `GEMINI_API_KEY` only live there.
name: rentthe6ix

services:
  web:
    build:
      context: .
      target: web
      args:
        # Inlined at build time. Empty ⇒ OpenFreeMap basemap (SPEC 20).
        NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
    restart: unless-stopped
    env_file: .env
    environment:
      # On-demand travel times (P2.11). The in-network name beats whatever .env says, and an
      # unreachable router degrades to labelled straight-line distance instead of failing search.
      OTP_URL: http://otp:8080
    # No host ports: Caddy reaches the app by service name on the compose network.
    expose:
      - "3000"

  worker:
    build:
      context: .
      target: worker
    # on-failure, not unless-stopped: while the entry point is still a no-op it exits
    # 0, and a clean exit must not restart-loop. Real crashes still come back.
    restart: on-failure
    # Chromium keeps page state in /dev/shm; Docker's 64 MB default crashes it on big pages.
    shm_size: 1gb
    env_file: .env
    environment:
      # In-network name; ignores whatever OTP_URL says in .env.
      OTP_URL: http://otp:8080
    volumes:
      # The ingest pipeline writes its caches through `new URL('../../.cache/…', import.meta.url)`,
      # so they land next to the source at /app/apps/worker/.cache whatever the cwd is. A named
      # volume keeps them across `--build` and `up` re-creates: losing the detail cache re-fetches
      # thousands of listing pages (and risks a block), and the Gemini cache costs real money.
      # `docker compose down -v` still deletes it — that is the only command that should.
      - worker-cache:/app/apps/worker/.cache

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # <ip-with-dashes>.sslip.io resolves to the instance's public IP, so Caddy can
      # get a real certificate without a domain. Set it in .env.
      SITE_HOST: ${SITE_HOST:?set SITE_HOST in .env, e.g. 203-0-113-7.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

  # --- OpenTripPlanner (S2) -------------------------------------------------
  # Hidden behind a profile: `docker compose up -d` never starts it, so a missing or
  # stale graph cannot break a deploy. Build the graph first (DEPLOY.md §4).
  otp:
    profiles: ["otp"]
    image: ${OTP_IMAGE:-opentripplanner/opentripplanner:2.7.0}
    restart: unless-stopped
    environment:
      # Heap size is a deploy decision, not a code one: locally 6g suits a machine also running
      # a dev server, while a 4 vCPU / 8 GB instance shares its RAM with web, worker and Caddy.
      # Set OTP_JAVA_OPTS=-Xmx4g in .env there. A larger -Xmx than the box has free RAM means
      # the container is OOM-killed while loading a graph that would otherwise fit.
      JAVA_TOOL_OPTIONS: ${OTP_JAVA_OPTS:--Xmx6g}
    # The image's entrypoint always passes /var/opentripplanner as the graph directory, so the
    # inputs and graph.obj live in the one mount (otp/build.sh writes them there). A separate
    # graphs/ mount would be an empty directory OTP never looks at.
    # graph.obj is git-ignored, so an instance either builds it (otp/build.sh) or receives it
    # with `scp otp/data/graph.obj …`. Uploading the built file avoids a 1 GB OSM download.
    volumes:
      - ./otp/data:/var/opentripplanner
    command: ["--load"]
    expose:
      - "8080"
    mem_limit: ${OTP_MEM_LIMIT:-7g}

volumes:
  caddy_data:
  caddy_config:
  worker-cache:
