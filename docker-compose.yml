# docker-compose.yml — owner: D (P0.9)
#
# The whole production stack on one Vultr instance: Caddy (TLS) → web (Next.js) and
# worker (ingest + precompute).
#
#   docker compose up -d --build          # web + worker + caddy
#
# Travel is straight-line distance between the two addresses, so nothing here renders a route.
#
# Values come from a manually-created `.env` next to this file (variables are listed in
# SPEC.md §20). `.env` is git-ignored; `DATABASE_URL` and `GEMINI_API_KEY` only live there.
name: rentthe6ix

services:
  web:
    build:
      context: .
      target: web
      args:
        # Inlined at build time. Empty ⇒ OpenFreeMap basemap (SPEC 20).
        NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
    restart: unless-stopped
    env_file: .env
    # No router is wired in: travel is the straight-line distance between the listing and the target.
    # No host ports: Caddy reaches the app by service name on the compose network.
    expose:
      - "3000"

  worker:
    build:
      context: .
      target: worker
    # on-failure, not unless-stopped: while the entry point is still a no-op it exits
    # 0, and a clean exit must not restart-loop. Real crashes still come back.
    restart: on-failure
    # Chromium keeps page state in /dev/shm; Docker's 64 MB default crashes it on big pages.
    shm_size: 1gb
    env_file: .env
    volumes:
      # The ingest pipeline writes its caches through `new URL('../../.cache/…', import.meta.url)`,
      # so they land next to the source at /app/apps/worker/.cache whatever the cwd is. A named
      # volume keeps them across `--build` and `up` re-creates: losing the detail cache re-fetches
      # thousands of listing pages (and risks a block), and the Gemini cache costs real money.
      # `docker compose down -v` still deletes it — that is the only command that should.
      - worker-cache:/app/apps/worker/.cache

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # <ip-with-dashes>.sslip.io resolves to the instance's public IP, so Caddy can
      # get a real certificate without a domain. Set it in .env.
      SITE_HOST: ${SITE_HOST:?set SITE_HOST in .env, e.g. 203-0-113-7.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

  # The router (OpenTripPlanner) is deliberately absent: travel is distance, and the code only
  # routes when TRAVEL_ROUTING=1 and OTP_URL are both set. otp/ still holds the graph build script.

volumes:
  caddy_data:
  caddy_config:
  worker-cache:
